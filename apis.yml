name: Cavium
description: >-
  Cavium, Inc. was a fabless semiconductor company founded in 2000 and
  headquartered in San Jose, California, that designed multicore processors and
  networking silicon for enterprise, data center, cloud, and service-provider
  infrastructure. Its product families included OCTEON multicore MIPS and ARM
  network and security processors, ThunderX ARM-based server SoCs, Nitrox
  security processors, LiquidIO intelligent adapters and smart NICs, and the
  FastLinQ Ethernet and Xpliant switch lines it gained through its 2016
  acquisition of QLogic. Cavium was a publicly traded company (NASDAQ: CAVM)
  before being acquired by Marvell Technology Group in July 2018 for roughly
  6 billion US dollars. Its technology now ships as part of Marvell's networking
  and infrastructure processor portfolio. As a silicon and hardware vendor,
  Cavium never operated a public developer API program or web API surface.
